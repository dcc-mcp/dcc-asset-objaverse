tools:
  - name: sample_objaverse_uids
    description: Return a small sample of Objaverse object UIDs.
    source_file: scripts/sample_objaverse_uids.py
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: objaverse
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        seed:
          type: integer
    output_schema:
      type: object

  - name: get_objaverse_annotations
    description: Load Objaverse annotations for specific UIDs.
    source_file: scripts/get_objaverse_annotations.py
    execution: sync
    affinity: any
    timeout_hint_secs: 120
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: objaverse
    input_schema:
      type: object
      required: ["uids"]
      properties:
        uids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
    output_schema:
      type: object

  - name: download_objaverse_objects
    description: Download Objaverse GLB objects and copy them into an output directory.
    source_file: scripts/download_objaverse_objects.py
    execution: sync
    affinity: any
    timeout_hint_secs: 600
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: objaverse
    input_schema:
      type: object
      required: ["uids", "output_dir"]
      properties:
        uids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
        output_dir:
          type: string
        download_processes:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
    output_schema:
      type: object
